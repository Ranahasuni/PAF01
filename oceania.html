<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTS Arirang Oceania Tour</title>
<style>
     body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #fff;
        color: #000;
    }

    h1 {
        text-align: center;
        margin: 30px 0;
    }

    table {
        width: 100%; /* full page width */
        border-collapse: collapse;
    }

    th, td {
        padding: 15px 20px;
        text-align: center;
        border-bottom: 1px solid #ddd;
        font-size: 16px;
    }

    /* Header style */
    th {
        background-color: #000;
        color: #fff;
        font-weight: bold;
    }

    /* Ticket column highlight */
    td a.ticket-link {
        display: inline-block;
        background-color: #fff;
        color: #000;
        padding: 8px 20px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 3px;
        transition: 0.6s ease;
    }

    td a.ticket-link:hover {
        background-color: #000;
        color: #fff;
    }

    /* Row hover effect */
    tbody tr:hover {
        background-color: #000;
        color: #fff;
    }

    tbody tr:hover td a.ticket-link {
        color: #fff; /* maintain contrast when hovering row */
        background-color: #000;
    }
</style>
</head>
<body>

<h1>🌏 Oceania Tour - BTS Arirang</h1>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Place</th>
            <th>Stadium</th>
            <th>Tickets</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>February 12, 2027</td>
            <td>Melbourne</td>

        </tr>

            <td><a href="https://btsworldtourofficial.com/" class="ticket-link">Ticket</a></td>
        </tr>
          <tr>
            <td>February 20, 2027</td>
            <td>Sydney</td>
            <td>Stay Tuned</td>
            <td><a href="https://btsworldtourofficial.com/" class="ticket-link">Ticket</a></td>
        </tr>
          <tr>
            <td>February 21, 2027</td>
            <td>Sydney</td>
            <td>Stay Tuned</td>
            <td><a href="https://btsworldtourofficial.com/" class="ticket-link">Ticket</a></td>
        </tr>
        
    </tbody>
</table>

</body>
</html>
